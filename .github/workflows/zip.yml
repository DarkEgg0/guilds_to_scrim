name: Zip folder GuildsToScrim and commit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  zip-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          rm -f GuildsToScrim.zip
          zip -r GuildsToScrim.zip GuildsToScrim/

      - name: Commit ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add GuildsToScrim.zip

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GuildsToScrim.zip"
            git push
          fi
